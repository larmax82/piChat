[package]
name = "pi-chat"
version = "0.1.0"
description = "piChat - Desktop shell for pi coding agent"
authors = ["piChat"]
edition = "2021"

[lib]
name = "pi_chat_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6"
ignore = "0.4"
dirs = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
